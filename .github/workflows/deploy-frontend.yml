name: Build & Deploy Frontend

# Validation-only: builds and tests the web portal and mobile app.
# Store/EC2 deployments are manual — see the note at the bottom of this file.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

jobs:
  build-web:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'camp-card-mobile-app-v2-web-main/repos/camp-card-web/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./camp-card-mobile-app-v2-web-main/repos/camp-card-web
        run: npm ci
      
      - name: Type check
        working-directory: ./camp-card-mobile-app-v2-web-main/repos/camp-card-web
        run: npm run type-check
      
      - name: Lint
        working-directory: ./camp-card-mobile-app-v2-web-main/repos/camp-card-web
        run: npm run lint
      
      - name: Run tests
        working-directory: ./camp-card-mobile-app-v2-web-main/repos/camp-card-web
        run: npm run test -- --passWithNoTests
      
      - name: Build
        working-directory: ./camp-card-mobile-app-v2-web-main/repos/camp-card-web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

  build-mobile:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'camp-card-mobile-app-v2-mobile-main/mobile/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./camp-card-mobile-app-v2-mobile-main/mobile
        run: npm ci
      
      - name: Type check
        working-directory: ./camp-card-mobile-app-v2-mobile-main/mobile
        run: npm run type-check

      - name: Run tests
        working-directory: ./camp-card-mobile-app-v2-mobile-main/mobile
        run: npm run test -- --passWithNoTests

  # NOTE: Store deployments are NOT done from CI.
  # The mobile app is a managed Expo project (no ios/android directories in git);
  # production builds and store submissions go through EAS from a developer machine:
  #   cd camp-card-mobile-app-v2-mobile-main/mobile
  #   EAS_NO_VCS=1 npx eas-cli build --profile production --platform android
  #   npx eas-cli submit --platform android --latest
  # The web portal deploys to EC2 via Docker (see deploy.yml / CLAUDE.md),
  # not Vercel. The previous Vercel/fastlane/gradle deploy jobs referenced
  # secrets and native directories that do not exist and never succeeded.
