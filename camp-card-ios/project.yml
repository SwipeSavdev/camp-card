name: CampCard
options:
  bundleIdPrefix: org.bsa
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Release
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: 5.9
  IPHONEOS_DEPLOYMENT_TARGET: 16.0
  MARKETING_VERSION: 2.0.0
  CURRENT_PROJECT_VERSION: 71
  DEVELOPMENT_TEAM: CL5DJUWXZY
  CODE_SIGN_STYLE: Automatic

packages:
  FirebaseMessaging:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  CampCard:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    resources:
      - Sources/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bsa.campcard
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/CampCard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: FirebaseMessaging

  CampCardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CampCard
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.bsa.campcard.tests
